<div class="relative" [style.width.px]="$width()" [style.height.px]="$rowsHeight()" aria-hidden="true">
  @for (slot of $slots(); track slot.label) {
    <div
      class="absolute flex items-center justify-center rounded-md border border-gold/70 bg-surface-high font-display text-base font-bold text-gold"
      [style.left.px]="slot.left"
      [style.top.px]="slot.top"
      [style.width.px]="cardWidth"
      [style.height.px]="cardHeight"
    >
      {{ slot.label }}
    </div>
  }
</div>
